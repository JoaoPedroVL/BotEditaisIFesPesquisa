name: Monitor de Editais - ONGs e IFES

on:
  schedule:
    # Segunda e quinta às 06:00 (UTC-3 = 09:00 UTC)
    - cron: '0 9 * * 1,4'
  workflow_dispatch:  # Permite rodar manualmente na aba Actions
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s testes -t . -v

  monitor:
    name: Monitor Editais (ONGs + IFES)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << 'EOF'
          # --- IA (NVIDIA NIM) ---
          NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}

          # --- Telegram (opcional) ---
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}

          # --- E-mail ---
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINO=${{ secrets.EMAIL_DESTINO }}
          EMAIL_DESTINO_IFES=${{ secrets.EMAIL_DESTINO_IFES }}
          EMAIL_REMETENTE=${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SSL=${{ secrets.EMAIL_SSL }}
          EMAIL_TLS=${{ secrets.EMAIL_TLS }}

          # --- WhatsApp (opcional) ---
          WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID=${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_DESTINO=${{ secrets.WHATSAPP_DESTINO }}
          EOF
          chmod 600 .env

      - name: Run monitor (dry-run first to verify)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python main.py --dry-run --limite-itens 3

      - name: Run monitor (produção)
        if: github.event_name == 'schedule'
        run: |
          python main.py

      - name: Upload logs (se houver erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-erro
          path: |
            logs/
            data/editais.db
          retention-days: 7

  notify-failure:
    name: Notificar falha
    runs-on: ubuntu-latest
    needs: [test, monitor]
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "⚠️ Workflow falhou! Verifique a aba Actions no GitHub."
          echo "Repositório: ${{ github.repository }}"
          echo "Run: ${{ github.run_id }}"